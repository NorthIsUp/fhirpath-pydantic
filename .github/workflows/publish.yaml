name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: mise run build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
