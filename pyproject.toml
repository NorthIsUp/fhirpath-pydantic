[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fhirpath-pydantic"
version = "0.1.0"
description = "Native typed FHIRPath queries for Pydantic FHIR resources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = ["antlr4-python3-runtime>=4.13,<4.14", "fhir.resources>=8.3,<9", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "fhirpathpy==2.2.4", "pyyaml>=6,<7", "types-PyYAML>=6,<7", "ruff>=0.14", "ty>=0.0.89", "pyright>=1.1.400"]

[tool.hatch.build.targets.wheel]
packages = ["src/fhirpath_pydantic"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests/native", "tests/cases", "tests/resources/*.json", "typings", "README.md", "LICENSE.md", "pyproject.toml", "mise.toml", "hk.pkl", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests/native"]
python_functions = ["test_*"]
addopts = "-ra --confcutdir=tests/native"

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["typings"]
[tool.ty.src]
include = ["src", "tests/native"]
exclude = ["src/fhirpath_pydantic/_grammar/*.py"]
[tool.ty.analysis]
respect-type-ignore-comments = false
[tool.ty.rules]
all = "error"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src/fhirpath_pydantic", "tests/native"]
exclude = ["src/fhirpath_pydantic/_grammar"]
stubPath = "typings"
enableTypeIgnoreComments = false
reportImplicitOverride = true

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]
exclude = ["src/fhirpath_pydantic/_grammar/*.py", "fhirpathpy", "tests/upstream", "tests/test_*", "tests/conftest.py"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B", "C4", "SIM", "RET", "PGH", "TID", "D100", "D101", "D102", "D103"]
ignore = ["E501"]
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Validate the boundary and use concrete types."}
"typing.cast" = {msg = "Narrow or validate the value instead."}

[tool.coverage.run]
source = ["fhirpath_pydantic"]
omit = ["*/_grammar/*"]
