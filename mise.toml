[tools]
hk = "2.8.1"

[tasks.sync]
run = "uv sync --locked --group dev"
[tasks.test]
run = "uv run pytest --confcutdir=tests/native"
[tasks.lint]
run = "hk check --all"
[tasks.check]
depends = ["test", "test:baseline", "lint"]
[tasks.build]
run = "uv build"
[tasks.benchmark]
run = "uv run python tests/native/benchmark.py"

[tasks.format]
run = "hk fix --all -S format"
[tasks.fix]
depends = ["format"]
run = "hk fix --all -S ruff"

[tasks.lock]
run = "uv lock"
[tasks.parity]
run = "uv run python tests/native/conformance.py"
[tasks.profile]
description = "Profile compiled native traversal on a synthetic Patient"
run = "uv run python tests/native/profile_runtime.py"

[tasks.grammar]
description = "Regenerate the native Python parser from the pinned ANTLR grammar (requires Java)"
run = "uv run python tools/generate_grammar.py"

[tasks."fixtures:hl7"]
description = "Fetch pinned official HL7 R4, R4B and R5 test corpora and every referenced input"
run = "uv run python tools/fetch_hl7.py"

[tasks."parity:hl7"]
description = "Audit every pinned official HL7 R4, R4B and R5 assertion against native resources"
run = "uv run python tests/native/hl7_conformance.py"

[tasks.smoke]
description = "Build and verify the wheel with native queries outside the checkout"
depends = ["build"]
run = "uv run python tools/smoke_distribution.py"

[tasks."test:baseline"]
description = "Run the retained Python regression tests against the pinned legacy engine"
run = "uv run pytest --confcutdir=tests -o 'python_functions=*_test' tests/test_*.py"
